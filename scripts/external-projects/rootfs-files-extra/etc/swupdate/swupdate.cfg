# ---------------------------------------------------------------------------
# swupdate.cfg  -  SWUpdate runtime configuration for PscgSecureOS
# ---------------------------------------------------------------------------

globals:
{
	verbose      = false;
	loglevel     = 1;
	status-file  = "/data/swupdate.status";
	bootenv-path = "/efi/EFI/Boot/grubenv";
};

sigver:
{
# Same PEM key material used to sign the RAUC bundle
	cafile = "/etc/swupdate/keyring.pem";
};

bootloader:
{
# grub backend: SWUpdate calls grub-editenv directly against bootenv-path
	backend = "grub";
};

hardware:
{
# Must match a top-level stanza name in sw-description.
# Switch between "PscgSecureOS-full" and "PscgSecureOS-plain"
# to select the LUKS+verity vs plain variant.
	hardware-revision = "1.0";
};
